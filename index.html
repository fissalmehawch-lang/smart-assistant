<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>مساعدة ذكية</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#111827;color:white;font-family:Arial;height:100vh;display:flex;flex-direction:column}
header{padding:20px;text-align:center;background:#1f2937;color:#a78bfa;font-size:23px;font-weight:bold}
#messages{flex:1;overflow-y:auto;padding:15px}
.msg{padding:13px;margin:10px 0;border-radius:15px;max-width:85%;line-height:1.7}
.bot{background:#273449;margin-left:auto}
.user{background:#7c3aed;margin-right:auto}
form{display:flex;padding:12px;gap:8px;background:#1f2937}
input{flex:1;min-width:0;padding:14px;border:0;border-radius:12px;background:#374151;color:white;font-size:16px}
button{padding:12px 18px;border:0;border-radius:12px;background:#7c3aed;color:white;font-size:16px}
</style>
</head>
<body>
<header>✨ مساعدة ذكية</header>
<div id="messages">
<div class="msg bot">مرحباً بك في مساعدة ذكية! كيف يمكنني مساعدتك اليوم؟</div>
</div>
<form id="form">
<input id="input" placeholder="اكتب رسالتك هنا..." autocomplete="off">
<button>إرسال</button>
</form>
<script>
const form=document.getElementById("form");
const input=document.getElementById("input");
const messages=document.getElementById("messages");
form.addEventListener("submit",function(e){
e.preventDefault();
let value=input.value.trim();
if(!value)return;
let msg=document.createElement("div");
msg.className="msg user";
msg.textContent=value;
messages.appendChild(msg);
input.value="";
messages.scrollTop=messages.scrollHeight;
});
</script>
</body>
</html>
