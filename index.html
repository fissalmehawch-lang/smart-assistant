<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>مساعدة ذكية</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#111827;color:white;font-family:Arial,sans-serif;display:flex;flex-direction:column;height:100vh}
header{padding:18px;background:#1f2937;text-align:center;font-size:22px;font-weight:bold;color:#a78bfa}
#messages{flex:1;overflow:auto;padding:16px}
.msg{padding:12px 15px;border-radius:14px;margin:10px 0;max-width:85%;line-height:1.6}
.bot{background:#273449;margin-left:auto}
.user{background:#6d28d9;margin-right:auto}
form{display:flex;gap:8px;padding:12px;background:#1f2937}
input{flex:1;min-width:0;padding:14px;border:0;border-radius:12px;background:#374151;color:white;font-size:16px}
button{border:0;border-radius:12px;padding:12px 17px;background:#7c3aed;color:white;font-size:16px}
</style>
</head>
<body>
<header>✨ مساعدة ذكية</header>
<div id="messages">
<div class="msg bot">مرحباً بك! أنا مساعدك الذكي. اكتب رسالتك للبدء.</div>
</div>
<form id="form">
<input id="input" placeholder="اكتب رسالتك هنا..." autocomplete="off">
<button type="submit">إرسال</button>
</form>
<script>
const form=document.getElementById('form');
const input=document.getElementById('input');
const messages=document.getElementById('messages');
form.addEventListener('submit',e=>{
e.preventDefault();
const value=input.value.trim();
if(!value)return;
const msg=document.createElement('div');
msg.className='msg user';
msg.textContent=value;
messages.appendChild(msg);
input.value='';
messages.scrollTop=messages.scrollHeight;
});
</script>
</body>
</html>
